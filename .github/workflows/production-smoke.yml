name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production smoke checks
        env:
          SECOND_DATE_URL: ${{ inputs.url }}
        run: node scripts/smoke-production.mjs
